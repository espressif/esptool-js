name: Deploy static content to Pages

# Run on the main branch or on a manual trigger
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build library
        run: npm ci && npm run build
      - name: Build example
        run: |
          cd examples/typescript
          npm install
          npm run build
      - name: Disable Jekyll
        run: touch examples/typescript/dist/.nojekyll
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: examples/typescript/dist
          clean-exclude: |
            pr-preview/**
          # Rebase onto gh-pages so this deploy does not wipe pull request previews.
          force: false
