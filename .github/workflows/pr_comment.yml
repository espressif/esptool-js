name: Comment on pull request
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
jobs:
  pr_comment:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: write

    steps:
      - uses: actions/github-script@v8
        with:
          # This snippet is public-domain, taken from
          # https://github.com/oprypin/nightly.link/blob/master/.github/workflows/pr-comment.yml
          script: |
            async function upsertComment(owner, repo, issue_number, purpose, body) {
              const comments = await github.paginate(github.rest.issues.listComments,
                {owner, repo, issue_number});

              const stickyMarker = "<!-- Sticky Pull Request Commentpr-preview -->";
              for (const comment of comments) {
                if (comment.body.includes(stickyMarker)) {
                  core.info(`Deleting sticky preview comment ${comment.id}`);
                  await github.rest.issues.deleteComment({owner, repo, comment_id: comment.id});
                }
              }

              const marker = `<!-- bot: ${purpose} -->`;
              body = marker + "\n" + body;

              const existing = comments.filter((c) => c.body.includes(marker));
              if (existing.length > 0) {
                const last = existing[existing.length - 1];
                core.info(`Updating comment ${last.id}`);
                await github.rest.issues.updateComment({
                  owner, repo,
                  body,
                  comment_id: last.id,
                });
              } else {
                core.info(`Creating a comment in issue / PR #${issue_number}`);
                await github.rest.issues.createComment({issue_number, body, owner, repo});
              }
            }

            const {owner, repo} = context.repo;
            const run_id = ${{github.event.workflow_run.id}};

            const pull_requests = ${{ toJSON(github.event.workflow_run.pull_requests) }};
            if (!pull_requests.length) {
              return core.error("This workflow doesn't match any pull requests!");
            }

            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts, {owner, repo, run_id});
            if (!artifacts.length) {
              return core.error(`No artifacts found`);
            }
            let body = `Download the artifacts for this pull request:\n`;
            for (const art of artifacts) {
              body += `\n* [${art.name}.zip](https://nightly.link/${owner}/${repo}/actions/artifacts/${art.id}.zip)`;
            }

            body += "\n\n## Testing it locally\n\n";
            body += "Check out this pull request, then run:\n\n";
            body += "```sh\n";
            body += "npm install\n";
            body += "npm run build\n";
            body += "cd examples/typescript\n";
            body += "npm install\n";
            body += "npm run dev\n";
            body += "```\n\n";
            body += "Open `http://localhost:1234` in Chrome. `npm run build` produces the `lib` the example loads.\n";

            body += "\n## Test from Pull Request artifact\n\n";
            body += "Each link above is a `.zip` from nightly.link that contains the `.tgz` package.\n\n";
            body += "1. Add the package to your project's `dependencies`:\n\n";
            body += "```json\n";
            body += "\"dependencies\": {\n";
            body += "  \"esptool-js\": \"file:../path/to/esptool-js-<version>.tgz\"\n";
            body += "}\n";
            body += "```\n\n";
            body += "2. Import it as `esptool-js/lib/index.js`.\n";

            const jobs = await github.paginate(
              github.rest.actions.listJobsForWorkflowRun, {owner, repo, run_id});
            const previewOk = jobs.some((job) => job.name === "preview" && job.conclusion === "success");

            for (const pr of pull_requests) {
              let commentBody = body;
              if (previewOk) {
                const previewUrl = `https://${owner}.github.io/${repo}/pr-preview/pr-${pr.number}/`;
                commentBody = `Example preview: ${previewUrl}\n\n`;
                commentBody += "This updates on each push. The page is removed when the pull request closes.\n\n";
                commentBody += body;
              }
              core.info(`Review thread message body for #${pr.number}:`, commentBody);
              await upsertComment(owner, repo, pr.number,
                "nightly-link", commentBody);
            }
